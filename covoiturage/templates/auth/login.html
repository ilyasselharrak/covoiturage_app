<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{% static 'login.css' %}">

<title>CovoiTudiant – Connexion</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{% static 'message.css' %}">
</head>

<body>

    {% include 'message/message.html' %}
<div class="card">

    <div class="logo">
        <div class="icon">
            <i class="fa-solid fa-car-side"></i>
        </div>

        <h1>CovoiTudiant</h1>
        <p>Plateforme de covoiturage étudiant</p>
    </div>

    <form method="POST">
    {% csrf_token %}
        <div class="input-group">
            <label>Email</label>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="text" placeholder="Ex :user@gmail.com" name="email" required>
            </div>
        </div>

        <div class="input-group">
            <label>Mot de passe</label>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="••••••••" name="password" required>
                
            </div>

        </div>

        <button class="btn">
            <i class="fa-solid fa-right-to-bracket"></i>
            Se connecter
        </button>

    </form>


    <div class="link">
        Pas de compte ?
        <a href="{% url 'register' %}">
            S'inscrire
        </a>
    </div>

    <div class="social">
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-google"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
    </div>

</div>
<script>

function closePopup(){

    document
    .querySelector('.popup-overlay')
    .style.display='none';
}

</script>
</body>
</html>
